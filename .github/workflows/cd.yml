# Graphia CD: build both images into Artifact Registry, deploy Cloud Run by digest.
#
# Repository settings (Settings -> Secrets and variables -> Actions):
#
#   Variables
#     APP_NAME              service prefix -> <APP_NAME>-api / <APP_NAME>-processor
#     GCP_REGION            optional; defaults to asia-southeast1
#     ARTIFACT_REPOSITORY   optional; defaults to graphia
#
#   Secrets
#     GCP_SA_KEY            service-account JSON key (google-github-actions/auth)
#
# The GCP project is read from the service-account key, so it is not a variable.
#
# One-time Artifact Registry setup (already done for elysiaa-api):
#
#   gcloud artifacts repositories create graphia \
#     --repository-format=docker --location=asia-southeast1
#   gcloud artifacts repositories add-iam-policy-binding graphia \
#     --location=asia-southeast1 \
#     --member="serviceAccount:github-deployer@<project>.iam.gserviceaccount.com" \
#     --role="roles/artifactregistry.writer"
#
# Rules this workflow enforces:
#   - no ":latest" tag; images are tagged sha-<full-commit>
#   - Cloud Run deploys the digest from build-push-action, never a tag
#   - images come from Artifact Registry in the deploy region, so Cloud Run does
#     not depend on the Docker Hub mirror or its propagation delay
#   - processor deploys before the API
#   - migrations never run here; run alembic upgrade head manually

name: CD

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/cd.yml"
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_TAG: sha-${{ github.sha }}
  API_SERVICE: ${{ vars.APP_NAME }}-api
  PROCESSOR_SERVICE: ${{ vars.APP_NAME }}-processor
  GCP_REGION: ${{ vars.GCP_REGION || 'asia-southeast1' }}
  ARTIFACT_REPOSITORY: ${{ vars.ARTIFACT_REPOSITORY || 'graphia' }}

jobs:
  deploy:
    name: Build, push, deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Check Artifact Registry repository
        run: |
          set -euo pipefail
          gcloud artifacts repositories describe "$ARTIFACT_REPOSITORY" \
            --project "${{ steps.auth.outputs.project_id }}" \
            --location "$GCP_REGION" \
            --format="value(name)"

      - name: Resolve image paths
        id: images
        run: |
          set -euo pipefail
          project="${{ steps.auth.outputs.project_id }}"
          registry="${GCP_REGION}-docker.pkg.dev"
          echo "api_image=${registry}/${project}/${ARTIFACT_REPOSITORY}/${API_SERVICE}" >> "$GITHUB_OUTPUT"
          echo "processor_image=${registry}/${project}/${ARTIFACT_REPOSITORY}/${PROCESSOR_SERVICE}" >> "$GITHUB_OUTPUT"

      - name: Configure Artifact Registry auth
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push API image
        id: build-api
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile.api
          push: true
          tags: ${{ steps.images.outputs.api_image }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push processor image
        id: build-processor
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile.processor
          push: true
          tags: ${{ steps.images.outputs.processor_image }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=processor
          cache-to: type=gha,mode=max,scope=processor

      - name: Deploy processor
        env:
          IMAGE: ${{ steps.images.outputs.processor_image }}@${{ steps.build-processor.outputs.digest }}
        run: |
          set -euo pipefail
          # Keep --allow-unauthenticated while processor_client.py authenticates
          # only with X-Internal-Token. If the client starts sending a Google ID
          # token, switch this to --no-allow-unauthenticated in the same change.
          #
          # The processor returns 202 before the conversion finishes. Cloud Run
          # must keep CPU allocated after that response, or LibreOffice and the
          # pure-Python converters are throttled to a crawl and time out.
          for attempt in 1 2 3 4; do
            if gcloud run deploy "$PROCESSOR_SERVICE" \
              --project "${{ steps.auth.outputs.project_id }}" \
              --region "$GCP_REGION" \
              --platform managed \
              --image "$IMAGE" \
              --allow-unauthenticated \
              --no-cpu-throttling \
              --cpu 1 \
              --memory 2Gi \
              --concurrency 1 \
              --min-instances 0 \
              --max-instances 1 \
              --quiet; then
              exit 0
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "::error::Processor deploy failed after 4 attempts."
              exit 1
            fi
            delay=$((attempt * 30))
            echo "::warning::Processor deploy attempt $attempt failed; retrying in ${delay}s."
            sleep "$delay"
          done

      - name: Check processor health
        run: |
          set -euo pipefail
          url=$(gcloud run services describe "$PROCESSOR_SERVICE" \
            --project "${{ steps.auth.outputs.project_id }}" \
            --region "$GCP_REGION" \
            --format="value(status.url)")
          echo "Processor URL: $url"
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 3 --retry-all-errors \
            "$url/health"
          echo

      - name: Deploy API
        env:
          IMAGE: ${{ steps.images.outputs.api_image }}@${{ steps.build-api.outputs.digest }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if gcloud run deploy "$API_SERVICE" \
              --project "${{ steps.auth.outputs.project_id }}" \
              --region "$GCP_REGION" \
              --platform managed \
              --image "$IMAGE" \
              --allow-unauthenticated \
              --quiet; then
              exit 0
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "::error::API deploy failed after 4 attempts."
              exit 1
            fi
            delay=$((attempt * 30))
            echo "::warning::API deploy attempt $attempt failed; retrying in ${delay}s."
            sleep "$delay"
          done

      - name: Check API health
        run: |
          set -euo pipefail
          url=$(gcloud run services describe "$API_SERVICE" \
            --project "${{ steps.auth.outputs.project_id }}" \
            --region "$GCP_REGION" \
            --format="value(status.url)")
          echo "API URL: $url"
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 3 --retry-all-errors \
            "$url/api/health"
          echo

      - name: Summary
        run: |
          {
            echo "### Deployed"
            echo ""
            echo "| Service | Image |"
            echo "|---|---|"
            echo "| \`$PROCESSOR_SERVICE\` | \`${{ steps.images.outputs.processor_image }}@${{ steps.build-processor.outputs.digest }}\` |"
            echo "| \`$API_SERVICE\` | \`${{ steps.images.outputs.api_image }}@${{ steps.build-api.outputs.digest }}\` |"
            echo ""
            echo "Tag: \`$IMAGE_TAG\`"
          } >> "$GITHUB_STEP_SUMMARY"
